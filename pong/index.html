<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pong Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet, scoreboard on top, court below, lobby overlay on the court */
:root{
  --ink:#0E1626; --court:#13203A; --line:#2B3E63; --chalk:#F2E8D5; --muted:#8C9AB8; --ball:#FF6B4A;
  --display:"Bungee", "Impact", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box}
header{width:100%;max-width:900px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,30px);margin:0;letter-spacing:.04em}
h1 span{color:var(--ball)}
#status{font-size:13px;color:var(--muted);min-width:0}
#status b{color:var(--chalk);font-weight:600}
.stage{position:relative;width:100%;max-width:900px}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:8/5;background:var(--court);border:2px solid var(--line);border-radius:6px;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--ink) 78%,transparent);border-radius:6px}
.panel{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-align:center;letter-spacing:.05em}
.row{display:flex;gap:8px}
button,input{font:inherit;font-size:15px;border-radius:4px}
button{background:var(--chalk);color:var(--ink);border:0;padding:11px 14px;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--chalk);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
input{flex:1;min-width:0;background:var(--court);color:var(--chalk);border:1px solid var(--line);padding:10px 12px;text-transform:uppercase;letter-spacing:.3em}
.code{font-family:var(--display);font-size:44px;text-align:center;letter-spacing:.2em;color:var(--ball)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0;line-height:1.5}
.sep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;text-align:center}
footer{width:100%;max-width:900px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>

<header>
  <h1>PONG<span>·</span>DUEL</h1>
  <div id="status">Hors ligne</div>
</header>

<div class="stage">
  <canvas id="c" width="800" height="500" aria-label="Terrain de Pong"></canvas>
  <div class="overlay" id="lobby">
    <div class="panel">
      <h2>Nouvelle partie</h2>
      <button id="btnHost" disabled>Créer une partie en ligne</button>
      <div class="row">
        <input id="codeIn" maxlength="4" placeholder="CODE" aria-label="Code de la partie" autocomplete="off">
        <button id="btnJoin" class="alt" disabled>Rejoindre</button>
      </div>
      <p class="hint" id="netHint">Connexion au canal temps réel…</p>
      <div class="sep">ou</div>
      <button id="btnLocal" class="alt">Jouer à deux sur cet écran</button>
    </div>
  </div>
  <div class="overlay" id="waiting" hidden>
    <div class="panel">
      <h2>Code à partager</h2>
      <div class="code" id="codeOut">----</div>
      <p class="hint">L'adversaire ouvre cet artefact et saisit ce code.<br>Il doit être connecté à son compte Claude.</p>
      <button class="alt" id="btnCancel">Annuler</button>
    </div>
  </div>
</div>

<footer>
  <span id="keys">Clavier : W/S ou ↑/↓ · Tactile : glisser sur votre moitié</span>
  <span>Premier à 7</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const W = 800, H = 500, PH = 84, PW = 12, BR = 7, WIN = 7;
const LX = 26, RX = W - 26 - PW;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { court: css('--court'), line: css('--line'), chalk: css('--chalk'), muted: css('--muted'), ball: css('--ball') };

// mode: 'menu' | 'local' | 'host' | 'guest'
let mode = 'menu', room = null, net = null;
const S = { pl: H/2, pr: H/2, bx: W/2, by: H/2, vx: 0, vy: 0, sl: 0, sr: 0, phase: 'idle', t: 0, msg: '' };
const keys = {};

const setStatus = h => { $('status').innerHTML = h; };

// ---------- physics (local + host) ----------
function serve(dir){
  S.bx = W/2; S.by = H/2; S.vx = 0; S.vy = 0; S.phase = 'serve'; S.t = 1.2; S.dir = dir;
}
function launch(){
  const a = (Math.random()*0.8 - 0.4);
  const sp = 380;
  S.vx = Math.cos(a)*sp*S.dir; S.vy = Math.sin(a)*sp; S.phase = 'play';
}
function resetMatch(){ S.sl = 0; S.sr = 0; serve(Math.random()<.5?1:-1); }

function hitPaddle(py, side){
  const off = Math.max(-1, Math.min(1, (S.by - py) / (PH/2)));
  const sp = Math.min(Math.hypot(S.vx, S.vy) * 1.06, 950);
  const ang = off * 1.0;
  S.vx = Math.cos(ang)*sp*(side==='l'?1:-1);
  S.vy = Math.sin(ang)*sp;
}

function step(dt){
  if (S.phase === 'serve'){ S.t -= dt; if (S.t <= 0) launch(); return; }
  if (S.phase !== 'play') return;
  S.bx += S.vx*dt; S.by += S.vy*dt;
  if (S.by < BR){ S.by = BR; S.vy = Math.abs(S.vy); }
  if (S.by > H-BR){ S.by = H-BR; S.vy = -Math.abs(S.vy); }
  if (S.vx < 0 && S.bx - BR <= LX + PW && S.bx > LX - 4 && Math.abs(S.by - S.pl) <= PH/2 + BR){ S.bx = LX+PW+BR; hitPaddle(S.pl,'l'); }
  if (S.vx > 0 && S.bx + BR >= RX && S.bx < RX + PW + 4 && Math.abs(S.by - S.pr) <= PH/2 + BR){ S.bx = RX-BR; hitPaddle(S.pr,'r'); }
  if (S.bx < -20){ S.sr++; endPoint(-1); }
  else if (S.bx > W+20){ S.sl++; endPoint(1); }
}
function endPoint(dir){
  if (S.sl >= WIN || S.sr >= WIN){ S.phase = 'over'; S.vx = S.vy = 0; return; }
  serve(dir);
}

// ---------- input ----------
const clampP = y => Math.max(PH/2, Math.min(H - PH/2, y));
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === ' ' && S.phase === 'over' && (mode === 'local' || mode === 'host')) { resetMatch(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const pointers = new Map();
function canvasY(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, canvasY(e));
  if (S.phase === 'over' && (mode === 'local' || mode === 'host')) resetMatch(); });
cv.addEventListener('pointermove', e => { if (pointers.has(e.pointerId) || e.pointerType === 'mouse') pointers.set(e.pointerId, canvasY(e)); });
const drop = e => pointers.delete(e.pointerId);
cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointers.delete(e.pointerId); });

function moveInputs(dt){
  const v = 520*dt;
  if (mode === 'local'){
    if (keys['w']) S.pl -= v; if (keys['s']) S.pl += v;
    if (keys['arrowup']) S.pr -= v; if (keys['arrowdown']) S.pr += v;
    for (const p of pointers.values()){ if (p.x < W/2) S.pl = p.y; else S.pr = p.y; }
  } else if (mode === 'host' || mode === 'guest'){
    const k = mode === 'host' ? 'pl' : 'pr';
    if (keys['w'] || keys['arrowup']) S[k] -= v;
    if (keys['s'] || keys['arrowdown']) S[k] += v;
    for (const p of pointers.values()) S[k] = p.y;
  }
  S.pl = clampP(S.pl); S.pr = clampP(S.pr);
}

// ---------- drawing ----------
function draw(){
  ctx.fillStyle = C.court; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = C.line; ctx.lineWidth = 2;
  ctx.setLineDash([10,12]); ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(W/2,H/2,60,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle = C.muted; ctx.font = '96px Bungee, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.globalAlpha = .35; ctx.fillText(S.sl, W/2-110, 26); ctx.fillText(S.sr, W/2+110, 26); ctx.globalAlpha = 1;

  ctx.fillStyle = C.chalk;
  const mine = mode === 'host' ? 'l' : mode === 'guest' ? 'r' : null;
  [['l',LX,S.pl],['r',RX,S.pr]].forEach(([s,x,y]) => {
    ctx.globalAlpha = (mine && mine !== s) ? .75 : 1;
    ctx.fillRect(x, y-PH/2, PW, PH);
  });
  ctx.globalAlpha = 1;

  if (S.phase === 'play' || S.phase === 'serve'){
    ctx.fillStyle = C.ball; ctx.beginPath(); ctx.arc(S.bx,S.by,BR,0,Math.PI*2); ctx.fill();
  }
  ctx.font = '600 18px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.chalk;
  if (S.phase === 'serve') ctx.fillText(Math.ceil(S.t) > 0 ? String(Math.ceil(S.t)) : '', W/2, H/2 + 90);
  if (S.phase === 'over'){
    const leftWon = S.sl > S.sr;
    let t = leftWon ? 'Gauche gagne' : 'Droite gagne';
    if (mode === 'host') t = leftWon ? 'Vous gagnez' : 'Vous perdez';
    if (mode === 'guest') t = leftWon ? 'Vous perdez' : 'Vous gagnez';
    ctx.font = '40px Bungee, Impact, sans-serif'; ctx.fillStyle = C.ball; ctx.fillText(t, W/2, H/2);
    ctx.font = '15px "IBM Plex Mono", monospace'; ctx.fillStyle = C.muted;
    ctx.fillText(mode === 'guest' ? 'L\'hôte relance la partie' : 'Espace ou toucher pour rejouer', W/2, H/2+40);
  }
  if (S.phase === 'wait'){
    ctx.font = '600 18px "IBM Plex Mono", monospace'; ctx.fillStyle = C.muted;
    ctx.fillText(S.msg || 'En attente…', W/2, H/2);
  }
}

// ---------- network ----------
// Two transports, same shape: send(obj) shares my state, onOther(obj|null) hears the opponent.
// Inside Claude: the artifact "room" capability. Elsewhere (GitHub Pages): PeerJS / WebRTC.
let transport = null; // 'room' | 'peer'

async function openRoomLink(asHost, code, onOther, onFail){
  const r = await room.join('pong-' + code.toLowerCase());
  const want = asHost ? 'guest' : 'host';
  r.onPeers(() => {
    const o = r.peers().find(p => !p.sameTab && p.presence && p.presence.role === want);
    onOther(o ? o.presence : null);
  }, err => onFail(err.code));
  return {
    send: obj => r.presence(obj).catch(()=>{}),
    close: () => r.leave().catch(()=>{})
  };
}

function openPeerLink(asHost, code, onOther, onFail){
  const id = 'letsdriveit-pong-' + code.toLowerCase();
  return new Promise((resolve, reject) => {
    const peer = asHost ? new Peer(id) : new Peer();
    let conn = null, closed = false;
    const link = {
      send: obj => { if (conn && conn.open) { try { conn.send(obj); } catch(_){} } },
      close: () => { closed = true; try { peer.destroy(); } catch(_){} }
    };
    const wire = c => {
      if (conn && conn.open && c !== conn){ c.close(); return; } // one opponent only
      conn = c;
      c.on('data', d => { if (d && typeof d === 'object') onOther(d); });
      c.on('close', () => { if (conn === c){ conn = null; if (!closed) onOther(null); } });
    };
    peer.on('error', e => {
      if (e.type === 'unavailable-id'){ reject(new Error('code-pris')); return; }
      if (e.type === 'peer-unavailable'){ reject(new Error('introuvable')); return; }
      if (!closed) onFail(e.type || 'erreur');
      reject(e);
    });
    peer.on('open', () => {
      if (asHost){ peer.on('connection', wire); resolve(link); }
      else {
        const c = peer.connect(id, { reliable: false, serialization: 'json' });
        c.on('open', () => { wire(c); resolve(link); });
      }
    });
    peer.on('disconnected', () => { if (!closed) peer.reconnect(); });
  });
}

async function startOnline(asHost, code){
  mode = asHost ? 'host' : 'guest';
  S.sl = S.sr = 0; S.pl = S.pr = H/2; S.phase = 'wait';
  S.msg = asHost ? 'En attente de l\'adversaire…' : 'Connexion à l\'hôte…';
  $('lobby').hidden = true;
  if (asHost){ $('codeOut').textContent = code; $('waiting').hidden = false; }
  setStatus((asHost ? 'Hôte' : 'Invité') + ' · partie <b>' + code + '</b>');
  $('keys').textContent = 'Votre raquette : ' + (asHost ? 'gauche' : 'droite') + ' · W/S, ↑/↓ ou glisser';
  net = { code, other: null, lastSend: 0, link: null };
  const myNet = net;

  const onOther = h => {
    if (net !== myNet) return;
    const had = !!net.other; net.other = h || null;
    if (asHost){
      if (h && !had){ $('waiting').hidden = true; resetMatch(); }
      if (!h && had){ S.phase = 'wait'; S.msg = 'Adversaire parti. En attente…'; $('waiting').hidden = false; }
      if (h && typeof h.p === 'number') S.pr = clampP(h.p);
    } else {
      if (!h){ if (had){ S.phase = 'wait'; S.msg = 'L\'hôte a quitté la partie.'; } return; }
      if (typeof h.p === 'number') S.pl = h.p;
      if (Array.isArray(h.b)){ S.bx = h.b[0]; S.by = h.b[1]; S.vx = h.b[2]; S.vy = h.b[3]; }
      if (Array.isArray(h.s)){ S.sl = h.s[0]; S.sr = h.s[1]; }
      if (typeof h.ph === 'string') S.phase = h.ph;
      if (typeof h.t === 'number') S.t = h.t;
    }
  };
  const onFail = code => { if (net !== myNet) return; S.phase = 'wait'; S.msg = 'Connexion perdue (' + code + ').'; };

  try {
    myNet.link = transport === 'room'
      ? await openRoomLink(asHost, code, onOther, onFail)
      : await openPeerLink(asHost, code, onOther, onFail);
    if (net !== myNet){ myNet.link.close(); return; }
    myNet.link.send({ role: asHost ? 'host' : 'guest', p: H/2 });
  } catch(e){
    if (net !== myNet) return;
    const m = e && e.message;
    await backToMenu();
    $('netHint').textContent = m === 'introuvable' ? 'Aucune partie avec ce code.'
      : m === 'code-pris' ? 'Code déjà utilisé, recréez une partie.'
      : 'Connexion impossible (' + ((e && (e.code || e.type)) || 'erreur') + ').';
  }
}

function sendState(now){
  if (!net || !net.link || now - net.lastSend < 33) return;
  net.lastSend = now;
  if (mode === 'host'){
    net.link.send({ role:'host', p: Math.round(S.pl),
      b:[Math.round(S.bx), Math.round(S.by), Math.round(S.vx), Math.round(S.vy)],
      s:[S.sl, S.sr], ph: S.phase, t: +S.t.toFixed(2) });
  } else {
    net.link.send({ role:'guest', p: Math.round(S.pr) });
  }
}

async function leaveOnline(){
  const n = net; net = null;
  if (n && n.link) n.link.close();
}
async function backToMenu(){
  await leaveOnline(); mode = 'menu'; S.phase = 'idle';
  $('waiting').hidden = true; $('lobby').hidden = false; setStatus('Hors ligne');
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (mode !== 'menu') moveInputs(dt);
  if (mode === 'local' || (mode === 'host' && net && net.other)) step(dt);
  else if (mode === 'guest' && S.phase === 'play'){ // dead reckoning between host updates
    S.bx += S.vx*dt; S.by += S.vy*dt;
    if (S.by < BR){ S.by = BR; S.vy = Math.abs(S.vy); }
    if (S.by > H-BR){ S.by = H-BR; S.vy = -Math.abs(S.vy); }
  } else if (mode === 'guest' && S.phase === 'serve'){ S.t = Math.max(0, S.t - dt); }
  if (mode === 'host' || mode === 'guest') sendState(now);
  draw();
  requestAnimationFrame(frame);
}

// ---------- lobby ----------
const genCode = () => { const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s += a[Math.floor(Math.random()*a.length)]; return s; };
$('btnHost').onclick = () => startOnline(true, genCode());
$('btnJoin').onclick = () => {
  const c = $('codeIn').value.trim().toUpperCase();
  if (!/^[A-Z0-9]{4}$/.test(c)){ $('netHint').textContent = 'Le code fait 4 caractères.'; return; }
  startOnline(false, c);
};
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });
$('btnLocal').onclick = () => {
  mode = 'local'; $('lobby').hidden = true; resetMatch();
  setStatus('Local · <b>deux joueurs</b>');
  $('keys').textContent = 'Gauche : W/S · Droite : ↑/↓ · Tactile : chaque moitié';
};
$('btnCancel').onclick = backToMenu;

S.phase = 'idle';
requestAnimationFrame(frame);

// pick a transport: the artifact room inside Claude, PeerJS everywhere else
(async () => {
  const enable = (t, hint) => {
    transport = t;
    $('btnHost').disabled = false; $('btnJoin').disabled = false;
    $('netHint').textContent = hint;
  };
  if (window.claude && typeof window.claude.use === 'function'){
    try { room = await window.claude.use('room'); } catch(_) { room = null; }
    if (room) return enable('room', 'Créez une partie et partagez le code, ou saisissez celui reçu.');
  }
  if (typeof window.Peer === 'function')
    return enable('peer', 'Créez une partie et partagez le code, ou saisissez celui reçu. Connexion directe entre navigateurs.');
  $('netHint').textContent = 'Jeu en ligne indisponible ici. Le mode local fonctionne.';
})();
})();
</script>

</body>
</html>
